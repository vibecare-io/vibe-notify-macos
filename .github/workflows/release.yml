name: Release

# Tags only. This workflow used to also run on every branch and pull
# request, which is why its runs were named "Create Release" for commits
# that released nothing.
on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:
    name: Build and Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'

      - name: Report toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Reject date-shaped tags
        # The tag glob cannot tell 0.0.6 from 5.10.2025, and this repo has one
        # of the latter left over. Pushing it re-triggered a release build that
        # failed. A four-digit final component is a date, not a patch number.
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]{1,3}$ ]]; then
            echo "::error::'$VERSION' is not a release version. Expected MAJOR.MINOR.PATCH with a patch below 1000."
            exit 1
          fi

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          cat > /tmp/notes.md <<EOF
          ## VibeNotify $VERSION

          A customizable notification overlay library for macOS, built with SwiftUI.

          ### Installation

          \`\`\`swift
          dependencies: [
              .package(url: "https://github.com/vibecare-io/vibe-notify-macos.git", from: "$VERSION")
          ]
          \`\`\`

          ### Changes

          ${{ steps.changelog.outputs.CHANGELOG }}

          ### Documentation

          - [README.md](https://github.com/vibecare-io/vibe-notify-macos/blob/main/README.md)
          - [DOCS.md](https://github.com/vibecare-io/vibe-notify-macos/blob/main/DOCS.md)
          EOF
          gh release create "$VERSION" --title "Release $VERSION" --notes-file /tmp/notes.md
